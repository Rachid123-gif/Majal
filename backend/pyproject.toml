[project]
name = "majal-backend"
version = "0.0.1"
description = "MAJAL — copilote d'intelligence territoriale (backend)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "geoalchemy2>=0.15",
    "pyyaml>=6.0",
    "itsdangerous>=2.2.0",
    "shapely>=2.1.2",
    "httpx>=0.28.1",
    "pmtiles>=3.8.1",
    "openpyxl>=3.1.5",
    "rasterio>=1.5.2",
    "numpy>=2.5.3",
    "rq>=2.12.0",
    "python-docx>=1.2.0",
    "weasyprint>=70.0",
    "matplotlib>=3.11.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-pyyaml>=6.0",
    "httpx2>=2.13.1",
    "types-shapely>=2.1.0.20260728",
    "types-openpyxl>=3.1.5.20260827",
    "mapbox-vector-tile>=2.2.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/"]

[[tool.mypy.overrides]]
module = ["rasterio", "rasterio.*", "mapbox_vector_tile", "weasyprint", "weasyprint.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
# Report texts in French and Arabic: long sentences and intentional Unicode (narrow no-break
# space, Arabic letters and digits) are expected there.
"app/services/reports/*.py" = ["E501", "RUF001"]
"tests/test_anti_invention.py" = ["E501", "RUF001"]
"tests/test_meaning.py" = ["E501", "RUF001"]
"tests/test_fictional_contributions.py" = ["RUF001"]
"tests/test_anonymization.py" = ["E501", "RUF001"]
"app/services/citizens/*.py" = ["E501", "RUF001"]
"tests/test_report_writer.py" = ["E501", "RUF001"]

[tool.ruff.lint.isort]
known-third-party = ["alembic"]
