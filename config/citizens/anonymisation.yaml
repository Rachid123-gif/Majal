  # présentation ou de parenté (« أنا سعيد » = « je suis Saïd », mais aussi « je suis heureux »).
  ambiguous: [سعيد, حسن, كريم, أمل, نور, جميلة, سعاد, رحمة, هناء, بشير, صابر, Amal, Nour]

# Tournures qui introduisent un nom de personne.
cues:
  # Le mot suivant est un nom, qu'il soit dans la liste ou non (en alphabet latin : s'il porte
  # une majuscule).
  strong:
    fr: ["je m'appelle", "je me nomme", "mon nom est", "je suis", "contact :", "joignable :", "signé"]
    ar: ["اسمي", "إسمي", "يدعى", "تدعى", "سميتي", "سميتو", "سميتها"]
    darija: [smiti, smitou, smitha, ana smiti]
  # Le mot suivant n'est masqué que s'il est dans la liste des prénoms (y compris ambigus).
  weak:
    fr: [mon voisin, ma voisine, mon fils, ma fille, mon frère, ma sœur, mon ami, mon amie, mon mari, ma femme, madame, monsieur]
    ar: [أنا, صاحبي, صاحبتي, جاري, جارتي, جارنا, جارتنا, ولدي, بنتي, أخي, أختي, السيد, السيدة]
    darija: [ana, sa7bi, jari, jarti, wldi, bnti, khoya, khti]

