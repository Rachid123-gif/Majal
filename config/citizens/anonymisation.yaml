# MAJAL — Anonymisation des contributions citoyennes, avant tout traitement par l'IA.
# Lu par backend/app/services/citizens/anonymize.py. Testé par backend/tests/test_anonymization.py.
#
# Masqués par des règles : adresses e-mail, téléphones marocains, numéros de carte d'identité
# nationale (CIN), plaques d'immatriculation, adresses précises (numéro + rue). Puis les noms de
# personnes : prénoms de la liste ci-dessous, et tout mot qui suit une tournure de présentation
# (« je m'appelle », « اسمي »…). Les noms de lieux connus (unités, quartiers, avenues) sont
# protégés : « Avenue Hassan II » ou « Yacoub El Mansour » ne sont jamais masqués.
# Enfin, l'IA locale peut signaler des noms restants (masqués seulement s'ils figurent
# mot pour mot dans le texte et ne sont pas des lieux connus).

placeholders:
  person: { fr: "[NOM]", ar: "[NOM]" }
  phone: { fr: "[TÉLÉPHONE]", ar: "[TÉLÉPHONE]" }
  email: { fr: "[E-MAIL]", ar: "[E-MAIL]" }
  national_id: { fr: "[CIN]", ar: "[CIN]" }
  plate: { fr: "[PLAQUE]", ar: "[PLAQUE]" }
  address: { fr: "[ADRESSE]", ar: "[ADRESSE]" }

