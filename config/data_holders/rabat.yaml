# MAJAL — Référentiel des institutions détentrices de données : Rabat (étape 5)
#
# Rôle : dire, pour chaque donnée qui manque ou qui n'est qu'estimée, QUI la détient, ce que
# MAJAL demande exactement et ce qu'elle permettrait. Ce fichier alimente l'écran « Ce que MAJAL
# pourrait faire avec vos données », les notes de demande (Word, PDF) et le tableau Excel.
#
# Statut : proposition. Liste des institutions fournie par le porteur du projet (2026-10-07).
# Chaque intitulé, en français comme en arabe, est À VÉRIFIER PAR LE PROFESSEUR
# (`to_verify: true`) : aucun intitulé n'est présenté comme officiel tant qu'il n'est pas vérifié.
#
# Les demandes viennent uniquement de trois sources, citées dans `source` :
# - grid: indicateur de la grille v0 non disponible ou seulement estimé / ouvert pour Rabat ;
# - taxonomy: thème citoyen sans indicateur, marqué « donnée à demander »
#   (config/taxonomy/urbain.yaml) ;
# - question: point ouvert de docs/questions-referent.md (ex. Q15) ;
# - context: projets programmés (programmes territoriaux intégrés, BRIEF §1), à mettre en regard
#   des déficits mesurés, sans indicateur propre.
# Les contributions citoyennes (fictives dans le démonstrateur) ne sont jamais citées dans les
# notes de demande (choix du porteur, 2026-10-07).
#
# Champs d'une demande :
#   holders       institutions destinataires (une note chacune ; une demande adressée à
#                 plusieurs communes porte sur le territoire de chacune) ;
#   alternatives  autres détenteurs possibles, affichés à l'écran, sans note ;
#   complementary détenteurs complémentaires (une partie de la même donnée), affichés à
#                 l'écran ; ils reçoivent leur propre demande, donc leur propre note ;
#   boundaries    la demande porte sur les limites officielles (priorité « essentielle ») ;
#   enables       indicateurs aujourd'hui « non disponibles » que la donnée permettrait de calculer ;
#   requires_also autre demande nécessaire pour calculer ces indicateurs ;
#   improves      indicateurs déjà calculés (estimés ou ouverts) qui deviendraient officiels ou
#                 plus fins ;
#   themes        thèmes citoyens sans indicateur que la donnée permettrait d'objectiver ;
#   detail        niveau de détail souhaité (Rabat : arrondissement, quartier ou îlot).
#
# Priorité de chaque demande : CALCULÉE, jamais choisie à la main
# (app/services/data_needs/priority.py, règle du porteur du 2026-10-07) :
#   essentielle  rend calculables des indicateurs aujourd'hui non disponibles (enables), ou
#                porte sur les limites officielles (boundaries) ;
#   utile        améliore des indicateurs estimés ou ouverts (improves), ou objective un thème
#                citoyen (themes) ;
#   contexte     projets programmés (context), même s'ils améliorent aussi un indicateur ;
#                catégorie distincte : plus tard, MAJAL
#                distinguera « besoin non couvert » et « besoin déjà couvert par un projet
#                programmé » (docs/questions-referent.md).
#
# Après toute modification : `make check-config`.

