  - code: emploi_jeunesse
    label: { fr: "Emploi et jeunesse", ar: "التشغيل والشباب" }
    description: "Chômage, formation, maisons de jeunes, activités pour les jeunes."
    keywords:
      fr: [emploi, chômage, travail, jeune, formation, stage, maison de jeunes]
      ar: [الشغل, البطالة, العمل, الشباب, التكوين, دار الشباب]
      darija: [khdma, lkhdma, chomage, chabab, drari, takwin]
    indicators: [EMP_CHOM, EMP_ACTF]

  - code: securite
    label: { fr: "Sécurité", ar: "الأمن" }
    description: "Sentiment d'insécurité, vols, éclairage des passages, présence de patrouilles."
    keywords:
      fr: [sécurité, insécurité, vol, agression, peur, patrouille]
      ar: [الأمن, انعدام الأمن, السرقة, الاعتداء, الخوف, الدوريات]
      darija: [aman, sri9a, khouf, cheffara]
    indicators: []

  - code: bruit
    label: { fr: "Bruit et nuisances", ar: "الضجيج والإزعاج" }
    description: "Bruit des chantiers, de la circulation, des fêtes ; odeurs ; fumées."
    keywords:
      fr: [bruit, bruyant, nuisance, vacarme, fumée, odeur]
      ar: [الضجيج, الإزعاج, الضوضاء, الدخان, الرائحة]
      darija: [sda3, tsda3, ri7a, dokhan]
    indicators: []

  - code: commerce_marches
    label: { fr: "Commerce et marchés", ar: "التجارة والأسواق" }
    description: "Marchés de quartier, commerces de proximité, vendeurs ambulants."
    keywords:
      fr: [marché, commerce, souk, magasin, épicerie, vendeur, ambulant]
      ar: [السوق, التجارة, المحلات, البقال, الباعة, الباعة المتجولين]
      darija: [souk, sou9, hanout, l7anout, ferracha, frracha]
    indicators: [MOB_15MIN]

  - code: culture_sport
    label: { fr: "Culture, sport et loisirs", ar: "الثقافة والرياضة والترفيه" }
    description: "Terrains de sport, bibliothèques, salles, activités culturelles."
    keywords:
      fr: [sport, terrain, stade, piscine, bibliothèque, culture, loisir, salle]
      ar: [الرياضة, الملعب, المسبح, المكتبة, الثقافة, الترفيه, القاعة]
      darija: [terrain, tiran, lkoura, piscine, bibliothèque]
    indicators: []

  - code: patrimoine
    label: { fr: "Patrimoine", ar: "التراث" }
    description: "Médina, remparts, monuments, façades anciennes."
    keywords:
      fr: [patrimoine, médina, rempart, monument, kasbah, historique, façade]
      ar: [التراث, المدينة القديمة, الأسوار, المآثر, القصبة, التاريخية]
      darija: [lmdina l9dima, swar, l9asba]
    indicators: []

  - code: administration
    label: { fr: "Administration et services", ar: "الإدارة والخدمات" }
    description: "Démarches, guichets, horaires, attente, services en ligne."
    keywords:
      fr: [administration, guichet, démarche, dossier, attente, papiers, service en ligne]
      ar: [الإدارة, الشباك, الوثائق, الملف, الانتظار, الخدمات الإلكترونية]
      darija: [lidara, l2idara, lwra9, wra9, tsnna, ssf]
    indicators: []

  - code: accessibilite_pmr
    label: { fr: "Accessibilité des personnes à mobilité réduite", ar: "ولوجيات الأشخاص في وضعية إعاقة" }
    description: "Rampes, ascenseurs, trottoirs accessibles, fauteuils roulants, poussettes."
    keywords:
      fr: [handicap, fauteuil roulant, rampe, ascenseur, mobilité réduite, poussette, accessible]
      ar: [الإعاقة, الكرسي المتحرك, المنحدر, المصعد, ذوي الاحتياجات الخاصة, الولوجيات]
      darija: [m3a9, mo3a9, kursi, l2asanseur]
    indicators: []

  - code: autres
    label: { fr: "Autres", ar: "مواضيع أخرى" }
    description: "Ce qui ne relève d'aucun autre thème."
    keywords: { fr: [], ar: [], darija: [] }
    indicators: []

# Croisement « ce que disent les citoyens / ce que montrent les données ».
# Aucune conclusion en dessous de min_contributions contributions pour une unité et un thème.
crossing:
  min_contributions: 3
  # Part des contributions de l'unité consacrée au thème, au-dessus de laquelle la demande
  # est dite « forte » (TODO_REFERENT).
  strong_share: 0.15
  labels:
    convergence:
      fr: "Demande forte et indicateur défavorable"
      ar: "طلب قوي ومؤشر غير موات"
    demand_only:
      fr: "Demande forte sans déficit mesuré — à creuser"
      ar: "طلب قوي دون خصاص مقيس — يستحق التعمق"
    data_only:
      fr: "Déficit mesuré sans demande exprimée"
      ar: "خصاص مقيس دون طلب معبر عنه"
