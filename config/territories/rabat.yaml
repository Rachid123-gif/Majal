# Territoire de démonstration : Rabat (profil urbain)
# Guide : chaque champ est expliqué dans docs/guide-utilisateur.md (section « Territoires »).
# Les codes officiels et les limites ne sont JAMAIS saisis ici : ils viennent des imports.
# Libellés arabes à relire par le référent scientifique (TODO_REFERENT).

code: rabat
schema_version: 1

name: { fr: "Rabat", ar: "الرباط" }
region: { fr: "Rabat-Salé-Kénitra", ar: "جهة الرباط سلا القنيطرة" }

study_area:
  level: prefecture
  label: { fr: "Préfecture de Rabat", ar: "عمالة الرباط" }

# Périmètres d'analyse. Le périmètre par défaut est l'agglomération (décision du 2026-10-05),
# pour disposer d'assez d'unités à comparer ; la préfecture seule reste disponible en filtre.
scopes:
  - code: agglomeration
    default: true
    label: { fr: "Agglomération Rabat-Salé-Skhirate-Témara", ar: "تجمع الرباط سلا الصخيرات تمارة" }
    reference_label: { fr: "de l'agglomération", ar: "التجمع الحضري" }
    members:
      - { level: prefecture, name_fr: "Rabat" }
      - { level: prefecture, name_fr: "Salé" }
      - { level: prefecture, name_fr: "Skhirate-Témara" }
  - code: prefecture
    label: { fr: "Préfecture de Rabat", ar: "عمالة الرباط" }
    reference_label: { fr: "de la préfecture", ar: "العمالة" }
    members:
      - { level: prefecture, name_fr: "Rabat" }

analysis_levels:
  main:
    levels: [arrondissement, commune]
    terms:
      arrondissement: { fr: "arrondissement", ar: "مقاطعة" }
      commune: { fr: "commune", ar: "جماعة" }
  fine:
    level: grid
    cell_size_m: 500
    term: { fr: "carreau de 500 m", ar: "مربع 500 م" }

profiles:
  indicators: urbain
  taxonomy: urbain

# Sources vérifiées le 2026-10-05 (docs/sources.md). Relancer les imports : `make data`.
sources:
  boundaries:
    importer: osm_boundaries
    # Niveaux administratifs d'OpenStreetMap au Maroc (admin_level) -> niveaux MAJAL.
    admin_levels: { prefecture: 5, commune: 8, arrondissement: 10 }
  facilities:
    importer: osm_facilities
    mapping: config/mappings/osm_facilities.yaml
  census:
    importer: hcp_census
    mapping: config/mappings/hcp_rgph.yaml
  roads:
    importer: osm_roads
    highway: [motorway, trunk, primary, secondary, tertiary, unclassified, track]
  places:
    importer: osm_places
    # Lieux nommés servant à localiser les contributions citoyennes (étape 4).
    place: [suburb, neighbourhood, quarter, square, locality, hamlet, village]
  grids:
    importer: ghsl_grids
    population_epoch: 2020
    built_up_epochs: [2015, 2020]
  basemap:
    importer: basemap_pmtiles
    maxzoom: 15

# Signalements de qualité, appliqués par code officiel HCP (réponse provisoire Q15).
quality_flags:
  - official_code: "44410108"   # Sidi Bouknadel
    boundary_unreliable: true
    exclude_from_ranking: true
    warning:
      fr: "Limite manifestement incomplète dans OpenStreetMap (2,1 km² pour 43 598 habitants) : indicateurs spatiaux non évaluables, commune exclue des classements. Limite officielle demandée."
      ar: "حدود غير مكتملة بشكل واضح في OpenStreetMap (2,1 كلم² مقابل 43598 نسمة): المؤشرات المجالية غير قابلة للتقييم، والجماعة مستثناة من الترتيب. تم طلب الحدود الرسمية."

data_holders: config/data_holders/rabat.yaml

map:
  center: null   # calculé depuis les limites importées
  zoom: null

demo:
  fictitious_contributions: data/demo/rabat_contributions.csv
