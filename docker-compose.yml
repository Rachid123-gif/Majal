# MAJAL — environnement local complet. Lancement : `make dev` (voir README).
name: majal

services:
  db:
    build: ./docker/db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-majal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-majal}
      POSTGRES_DB: ${POSTGRES_DB:-majal}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-majal} -d ${POSTGRES_DB:-majal}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-majal}:${POSTGRES_PASSWORD:-majal}@db:5432/${POSTGRES_DB:-majal}
      REDIS_URL: redis://redis:6379/0
      CONFIG_DIR: /config
      APP_ENV: ${APP_ENV:-development}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      SOVEREIGN_MODE: ${SOVEREIGN_MODE:-true}
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:8b}
      OLLAMA_FALLBACK_MODEL: ${OLLAMA_FALLBACK_MODEL:-gemma3:4b}
      SESSION_SECRET: ${SESSION_SECRET:-}
      DEMO_PROFESSEUR_PASSWORD: ${DEMO_PROFESSEUR_PASSWORD:-}
      DEMO_PRESENTATEUR_PASSWORD: ${DEMO_PRESENTATEUR_PASSWORD:-}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./config:/config:ro
      - ./data:/data
      - ./docs:/docs
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Background report generation (RQ). Same image and settings as the backend.
  worker:
    build: ./backend
    command: ["rq", "worker", "--url", "redis://redis:6379/0", "reports"]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-majal}:${POSTGRES_PASSWORD:-majal}@db:5432/${POSTGRES_DB:-majal}
      REDIS_URL: redis://redis:6379/0
      CONFIG_DIR: /config
      APP_ENV: ${APP_ENV:-development}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      SOVEREIGN_MODE: ${SOVEREIGN_MODE:-true}
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:8b}
      OLLAMA_FALLBACK_MODEL: ${OLLAMA_FALLBACK_MODEL:-gemma3:4b}
    volumes:
      - ./backend:/app
      - ./config:/config:ro
      - ./data:/data
      - ./docs:/docs
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      # The browser only talks to the frontend; /api/* is forwarded to the backend.
      BACKEND_INTERNAL_URL: http://backend:8000
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend

volumes:
  pgdata:
